name: Publish MCP server

# Publishes factura-luz-mcp to npm and lists it in the MCP Registry when an
# mcp-v* tag is pushed, for example:
#   npm version patch -w factura-luz-mcp
#   git tag mcp-v0.1.1 && git push origin mcp-v0.1.1
#
# No secrets are needed. Both registries authenticate with this workflow's
# GitHub OIDC token:
#   - npm, via trusted publishing, configured on the package settings page and
#     pinned to this repository and this workflow filename.
#   - The MCP Registry, whose OIDC login is also what proves ownership of the
#     io.github.ilopezluna/* namespace.
on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing and for MCP Registry OIDC login.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22.20.0 ships npm 10.9.3, and trusted publishing needs 11.5.1 or
      # later. Upgrading here keeps .nvmrc as the single source of truth for the
      # Node version the project is built and tested against.
      - run: npm install -g npm@latest

      - run: npm ci

      # Never publish something that does not pass its own tests.
      - run: npm run typecheck -w factura-luz-mcp
      - run: npm test -w factura-luz-mcp
      - run: npm run build -w factura-luz-mcp

      # The registry rejects a server.json whose version does not match the
      # published package, so derive both from package.json rather than trusting
      # them to have been edited together.
      - name: Sync server.json version with package.json
        working-directory: mcp
        run: |
          VERSION=$(jq -r .version package.json)
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          echo "Publishing version $VERSION"

      # No NODE_AUTH_TOKEN and no --provenance: trusted publishing supplies a
      # short-lived credential and attaches provenance on its own.
      - run: npm publish -w factura-luz-mcp --access public

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish to the MCP Registry
        working-directory: mcp
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
