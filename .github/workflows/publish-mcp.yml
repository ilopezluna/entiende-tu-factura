name: Publish MCP server

# Releases factura-luz-mcp when an mcp-v* tag is pushed, for example:
#   npm version patch -w factura-luz-mcp
#   git tag mcp-v0.1.1 && git push origin mcp-v0.1.1
#
# No secrets are involved. Both registries authenticate with this workflow's
# GitHub OIDC token:
#   - npm, via trusted publishing, pinned on the package settings page to this
#     repository and to this workflow's filename.
#   - The MCP Registry, whose OIDC login also proves ownership of the
#     io.github.ilopezluna/* namespace.
#
# The npm side is a STAGED publish: the tag does not put anything live. A human
# approves the staged version with 2FA, and only then does the registry job run.
on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:

jobs:
  stage:
    name: Test and stage on npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22.20.0 ships npm 10.9.3. Trusted publishing needs 11.5.1 and
      # staged publishing needs 11.15.0, so npm is upgraded here and .nvmrc stays
      # the single source of truth for the Node version we build and test against.
      #
      # Pinned to major 11, not 12: npm 12 requires Node ^22.22.2 and .nvmrc is on
      # 22.20.0, so `npm@12` fails with EBADENGINE before doing anything. Latest
      # 11.x clears the 11.15.0 bar. Moving to 12 means bumping .nvmrc first.
      - run: npm install -g npm@11

      - run: npm ci

      # Never release something that does not pass its own tests.
      - run: npm run typecheck -w factura-luz-mcp
      - run: npm test -w factura-luz-mcp
      - run: npm run build -w factura-luz-mcp

      # The MCP Registry rejects a server.json whose version does not match the
      # published package, so derive both from package.json rather than trusting
      # them to have been edited together.
      - name: Sync server.json version with package.json
        working-directory: mcp
        run: |
          VERSION=$(jq -r .version package.json)
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          echo "Releasing version $VERSION"

      # Staged, not live. Approve it on npmjs.com under Staged Packages, or with
      # `npm stage approve <stage-id>`. Trusted publishing attaches provenance on
      # its own, so there is no --provenance flag and no NODE_AUTH_TOKEN.
      - name: Stage the npm release
        working-directory: mcp
        run: npm stage publish --access public

      # Carried to the next job, which runs after the staged version is approved.
      - uses: actions/upload-artifact@v4
        with:
          name: server-json
          path: mcp/server.json

  registry:
    name: List on the MCP Registry
    needs: stage
    runs-on: ubuntu-latest
    # Gated on purpose: this job waits for a reviewer so the registry never
    # advertises a version that is still sitting unapproved in npm's staging
    # area. The 'release' environment must have you as a required reviewer,
    # otherwise GitHub runs this immediately and the gate does nothing.
    environment: release
    permissions:
      contents: read
      # Required for the MCP Registry OIDC login.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: server-json
          path: mcp

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish to the MCP Registry
        working-directory: mcp
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
