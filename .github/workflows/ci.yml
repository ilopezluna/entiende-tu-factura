name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The MCP server shares src/lib/cnmc with the web app, so it is built and
      # tested on every change rather than only before a release.
      - run: npm run typecheck -w factura-luz-mcp
      - run: npm test -w factura-luz-mcp
      - run: npm run build -w factura-luz-mcp
